<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幼兒課堂訓練進度板</title>
<style>
  :root {
    /* 預設主題：晴空藍 (Sky) */
    --bg-grad-1: #dff2fe;
    --bg-grad-2: #bae6fd;
    --bar-bg: rgba(255, 255, 255, 0.88);
    --bar-border: #7dd3fc;
    --active-border: #f59e0b;
    --active-lip: #d97706;
    --done-green: #16a34a;
    --done-lip: #15803d;
    --reward-gold: #eab308;
    --text-dark: #0f172a;

    /* 動態計算尺寸 */
    --card-size: 260px;
    --card-gap: 26px;
    --token-size: 84px;
    --track-width: 900px;
  }

  /* 主題 2：森林綠 (Mint) */
  body.theme-mint {
    --bg-grad-1: #dcfce7;
    --bg-grad-2: #a7f3d0;
    --bar-border: #6ee7b7;
  }

  /* 主題 3：暖陽橙 (Peach) */
  body.theme-peach {
    --bg-grad-1: #ffedd5;
    --bg-grad-2: #fed7aa;
    --bar-border: #fdba74;
  }

  /* 主題 4：木紋室 (Wood) */
  body.theme-wood {
    --bg-grad-1: #f5ebe0;
    --bg-grad-2: #e3d5ca;
    --bar-border: #d5bdaf;
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    font-family: "PingFang HK", "Heiti TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(circle at 50% 25%, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    transition: background 0.4s ease;
  }

  /* 全螢幕彩紙特效畫布 */
  #fxCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 950;
  }

  /* 頂部懸浮圓角工具欄 */
  .top-bar-wrap {
    padding: clamp(8px, 1.2vh, 14px) clamp(14px, 2vw, 28px) 0;
    flex-shrink: 0;
    z-index: 30;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 18px;
    background: var(--bar-bg);
    backdrop-filter: blur(8px);
    border: 3px solid var(--bar-border);
    border-radius: 22px;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    gap: 10px;
    flex-wrap: wrap;
  }

  .board-title {
    font-size: clamp(1.2rem, 2.1vh, 1.65rem);
    font-weight: 900;
    padding: 6px 16px;
    border-radius: 14px;
    cursor: pointer;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    box-shadow: 0 3px 0 #cbd5e1;
  }

  .teacher-controls {
    display: flex;
    gap: clamp(6px, 0.7vw, 10px);
    align-items: center;
    flex-wrap: wrap;
  }

  /* 3D 立體按鈕 */
  .btn {
    border: 2px solid #cbd5e1;
    background: #ffffff;
    color: var(--text-dark);
    font-size: clamp(0.84rem, 1.4vh, 1.08rem);
    font-weight: 900;
    padding: clamp(6px, 0.8vh, 9px) clamp(10px, 0.95vw, 15px);
    border-radius: 14px;
    box-shadow: 0 4px 0 #cbd5e1;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
  }

  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #cbd5e1;
  }

  .btn-primary {
    background: #0ea5e9;
    color: #fff;
    border-color: #0284c7;
    box-shadow: 0 4px 0 #0369a1;
  }

  .btn-counter-tool {
    background: #f59e0b;
    color: #fff;
    border-color: #d97706;
    box-shadow: 0 4px 0 #b45309;
  }

  .btn-reorder-active {
    background: #7c3aed;
    color: #fff;
    border-color: #6d28d9;
    box-shadow: 0 4px 0 #4c1d95;
  }

  .btn-success {
    background: #22c55e;
    color: #fff;
    border-color: #16a34a;
    box-shadow: 0 4px 0 #15803d;
  }

  .btn-camera {
    background: #ef4444;
    color: #fff;
    border-color: #dc2626;
    box-shadow: 0 4px 0 #b91c1c;
  }

  .btn-lock-active {
    background: #1e293b;
    color: #fff;
    border-color: #0f172a;
    box-shadow: 0 4px 0 #020617;
  }

  body.clean-mode .teacher-only {
    display: none !important;
  }

  /* 調動次序模式提示橫幅 */
  .reorder-banner {
    display: none;
    background: #7c3aed;
    color: #ffffff;
    font-weight: 900;
    font-size: clamp(0.95rem, 1.6vh, 1.2rem);
    padding: 6px 20px;
    border-radius: 999px;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.35);
    margin-top: 6px;
    align-self: center;
    z-index: 25;
  }

  body.reorder-mode .reorder-banner {
    display: block;
  }

  /* 中央主舞台 */
  .main-workspace {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1vh 2vw;
    gap: clamp(14px, 2.4vh, 28px);
    width: 100%;
  }

  /* ==========================================================================
   * 3D 立體踏腳石能量管道
   * ========================================================================== */
  .token-track-wrapper {
    display: none;
    width: var(--track-width);
    max-width: 94vw;
    flex-shrink: 0;
    padding: 8px 0;
  }

  body.mode-token .token-track-wrapper {
    display: block;
  }

  .token-lane {
    position: relative;
    height: calc(var(--token-size) + 18px);
    display: flex;
    align-items: center;
  }

  .track-pipe-bg {
    position: absolute;
    left: calc(var(--card-size) / 2);
    right: calc(var(--card-size) / 2);
    height: 22px;
    background: rgba(255, 255, 255, 0.75);
    border: 4px solid #94a3b8;
    border-radius: 999px;
    box-shadow: inset 0 4px 6px rgba(0,0,0,0.12);
    overflow: hidden;
    z-index: 1;
  }

  .track-pipe-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    border-radius: 999px;
    transition: width 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .track-nodes-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  .track-stone {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #ffffff;
    border: 5px solid #94a3b8;
    box-shadow: 0 5px 0 #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    font-weight: 900;
    color: #94a3b8;
    transition: all 0.3s ease;
  }

  .track-stone.stone-done {
    background: #22c55e;
    border-color: #ffffff;
    box-shadow: 0 5px 0 #15803d;
    color: #ffffff;
  }

  .track-stone.stone-current {
    background: #fef08a;
    border-color: #f59e0b;
    box-shadow: 0 5px 0 #d97706, 0 0 0 6px rgba(245, 158, 11, 0.3);
    color: #b45309;
  }

  .photo-token {
    position: absolute;
    width: var(--token-size);
    height: var(--token-size);
    border-radius: 50%;
    border: 5px solid #ffffff;
    outline: 5px solid var(--active-border);
    box-shadow: 0 10px 22px rgba(0,0,0,0.3);
    overflow: hidden;
    background: #fff;
    transition: left 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
    cursor: pointer;
  }

  .photo-token.token-hopping {
    animation: tokenArcHop 0.55s cubic-bezier(0.25, 1, 0.5, 1);
  }

  @keyframes tokenArcHop {
    0% { transform: translateY(0) scale(1); }
    45% { transform: translateY(-34px) scale(1.16); }
    80% { transform: translateY(4px) scale(0.95); }
    100% { transform: translateY(0) scale(1); }
  }

  .photo-token img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ==========================================================================
   * 3D 厚身玩具磚相片圖卡
   * ========================================================================== */
  .schedule-stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--card-gap);
    width: 100%;
    flex-wrap: nowrap;
  }

  .photo-card {
    position: relative;
    width: var(--card-size);
    background: #ffffff;
    border-radius: calc(var(--card-size) * 0.085);
    padding: calc(var(--card-size) * 0.05);
    border: 4px solid #cbd5e1;
    box-shadow: 0 10px 0 #94a3b8, 0 16px 28px rgba(15, 23, 42, 0.14);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.28s ease,
                border-color 0.28s ease,
                box-shadow 0.28s ease;
    flex-shrink: 0;
  }

  /* 當前步驟 */
  .photo-card.is-current {
    transform: scale(1.1) translateY(-6px);
    border-color: var(--active-border);
    border-width: 6px;
    box-shadow: 0 12px 0 var(--active-lip),
                0 0 0 10px rgba(251, 191, 36, 0.45),
                0 24px 42px rgba(15, 23, 42, 0.25);
    z-index: 5;
    animation: currentCardFloat 2.4s infinite ease-in-out;
  }

  @keyframes currentCardFloat {
    0%, 100% {
      transform: scale(1.1) translateY(-6px);
      box-shadow: 0 12px 0 var(--active-lip),
                  0 0 0 8px rgba(251, 191, 36, 0.4),
                  0 24px 42px rgba(15, 23, 42, 0.24);
    }
    50% {
      transform: scale(1.12) translateY(-11px);
      box-shadow: 0 16px 0 var(--active-lip),
                  0 0 0 14px rgba(251, 191, 36, 0.6),
                  0 30px 48px rgba(15, 23, 42, 0.28);
    }
  }

  /* 未到嘅步驟 */
  .photo-card.is-upcoming {
    transform: scale(0.91);
    opacity: 0.72;
    filter: saturate(85%);
  }

  /* 已完成步驟 */
  .photo-card.is-done {
    transform: scale(0.88) translateY(4px);
    opacity: 0.55;
    border-color: var(--done-green);
    box-shadow: 0 5px 0 var(--done-lip), 0 8px 14px rgba(0,0,0,0.1);
  }

  /* 最終獎勵卡 */
  .photo-card.is-reward {
    background: linear-gradient(180deg, #ffffff 0%, #fef9c3 100%);
    border-color: var(--reward-gold);
    box-shadow: 0 10px 0 #ca8a04, 0 16px 28px rgba(15, 23, 42, 0.15);
  }

  .photo-card.is-reward.is-current {
    border-color: #16a34a;
    box-shadow: 0 12px 0 #15803d,
                0 0 0 12px rgba(34, 197, 94, 0.45),
                0 24px 44px rgba(15, 23, 42, 0.28);
  }

  /* 調動次序模式下嘅魔術貼微晃效果與選中框 */
  body.reorder-mode .photo-card:not(.is-done) {
    opacity: 1;
    filter: none;
    animation: velcroWiggle 0.45s infinite ease-in-out alternate;
    cursor: grab;
  }

  body.reorder-mode .photo-card:not(.is-done):nth-child(even) {
    animation-direction: alternate-reverse;
  }

  @keyframes velcroWiggle {
    0% { transform: rotate(-1.4deg) scale(0.98); }
    100% { transform: rotate(1.4deg) scale(0.98); }
  }

  .photo-card.swap-selected {
    border-color: #7c3aed !important;
    border-width: 6px !important;
    box-shadow: 0 12px 0 #5b21b6, 0 0 0 12px rgba(124, 58, 237, 0.45) !important;
    transform: scale(1.08) translateY(-10px) !important;
    animation: none !important;
    z-index: 15 !important;
  }

  .photo-card.drag-over-target {
    outline: 6px dashed #7c3aed;
    outline-offset: 6px;
  }

  .card-img-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: calc(var(--card-size) * 0.055);
    overflow: hidden;
    background: #e2e8f0;
    position: relative;
    border: 2px solid rgba(15, 23, 42, 0.08);
  }

  .photo-card.is-current .card-img-box::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -120%;
    width: 65%;
    height: 200%;
    background: linear-gradient(
      90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.55) 50%,
      rgba(255,255,255,0) 100%
    );
    transform: rotate(25deg);
    animation: glossySweep 2.8s infinite ease-in-out;
    pointer-events: none;
  }

  @keyframes glossySweep {
    0% { left: -120%; }
    45%, 100% { left: 160%; }
  }

  .card-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }

  /* 完成大剔號印仔 */
  .done-stamp {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(22, 163, 74, 0.58);
    align-items: center;
    justify-content: center;
  }

  .photo-card.is-done .done-stamp,
  .photo-card.is-stamping .done-stamp {
    display: flex;
  }

  .done-check {
    width: calc(var(--card-size) * 0.44);
    height: calc(var(--card-size) * 0.44);
    border-radius: 50%;
    background: #ffffff;
    color: var(--done-green);
    font-size: calc(var(--card-size) * 0.27);
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 5px solid var(--done-green);
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
  }

  .photo-card.is-stamping .done-check {
    animation: stampSlam 0.26s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
  }

  @keyframes stampSlam {
    0% { transform: scale(2.2); opacity: 0; }
    70% { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 卡片左上角「計次」掣 ＋ 右上角「影相」掣 */
  .card-open-counter-btn {
    position: absolute;
    top: calc(var(--card-size) * 0.07);
    left: calc(var(--card-size) * 0.07);
    background: rgba(245, 158, 11, 0.94);
    color: #ffffff;
    border: 2px solid #ffffff;
    border-radius: 10px;
    padding: 4px 9px;
    font-size: clamp(0.74rem, calc(var(--card-size) * 0.054), 1rem);
    font-weight: 900;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
    cursor: pointer;
    z-index: 6;
  }

  .card-cam-btn {
    position: absolute;
    top: calc(var(--card-size) * 0.07);
    right: calc(var(--card-size) * 0.07);
    background: rgba(15, 23, 42, 0.82);
    color: #ffffff;
    border: 2px solid rgba(255,255,255,0.8);
    border-radius: 10px;
    padding: 4px 9px;
    font-size: clamp(0.74rem, calc(var(--card-size) * 0.054), 1rem);
    font-weight: 900;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22);
    cursor: pointer;
    z-index: 6;
  }

  /* 卡片底部：左右換位細掣 ◀ + 文字名稱 + ▶ */
  .card-footer-row {
    margin-top: calc(var(--card-size) * 0.04);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }

  .swap-arrow-btn {
    background: #f1f5f9;
    border: 2px solid #cbd5e1;
    color: #475569;
    border-radius: 8px;
    width: clamp(26px, calc(var(--card-size) * 0.13), 38px);
    height: clamp(26px, calc(var(--card-size) * 0.13), 38px);
    font-size: clamp(0.75rem, calc(var(--card-size) * 0.06), 1.05rem);
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }

  .swap-arrow-btn:hover:not(:disabled) {
    background: #7c3aed;
    border-color: #6d28d9;
    color: #ffffff;
  }

  .swap-arrow-btn:active:not(:disabled) {
    transform: scale(0.9);
  }

  .swap-arrow-btn:disabled {
    opacity: 0.2;
    cursor: default;
  }

  .card-label {
    flex: 1;
    text-align: center;
    font-size: calc(var(--card-size) * 0.14);
    font-weight: 900;
    letter-spacing: 1px;
    color: var(--text-dark);
    padding: 3px 4px;
    border-radius: 10px;
    border: 2px dashed transparent;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  body:not(.clean-mode) .card-label:hover {
    border-color: #94a3b8;
    background: #f8fafc;
  }

  /* 拋物線飛行中嘅分身相片卡 */
  .flying-card-clone {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    background: #ffffff;
    border-radius: calc(var(--card-size) * 0.085);
    padding: calc(var(--card-size) * 0.05);
    border: 5px solid var(--done-green);
    box-shadow: 0 24px 48px rgba(0,0,0,0.38);
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: top left;
    will-change: transform;
  }

  .flying-card-clone .card-img-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: calc(var(--card-size) * 0.055);
    overflow: hidden;
  }

  .flying-card-clone .card-label {
    margin-top: calc(var(--card-size) * 0.042);
    font-size: calc(var(--card-size) * 0.145);
    font-weight: 900;
    color: var(--text-dark);
  }

  /* ==========================================================================
   * 3D 立體開口收納盒「完成袋」
   * ========================================================================== */
  .bottom-tray-area {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 0 2vw 1.2vh;
    flex-shrink: 0;
  }

  .finished-pocket {
    position: relative;
    width: min(860px, 92vw);
    height: clamp(102px, 15vh, 152px);
    background: #cbd5e1;
    border: 4px solid #64748b;
    border-radius: 24px;
    box-shadow: inset 0 8px 18px rgba(15, 23, 42, 0.22), 0 8px 0 #64748b, 0 14px 24px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    padding: 10px 22px 18px 22px;
    gap: 18px;
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.25s ease;
  }

  .finished-pocket::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 26%;
    background: linear-gradient(180deg, rgba(248, 250, 252, 0.88) 0%, #e2e8f0 100%);
    border-top: 3px solid #94a3b8;
    pointer-events: none;
    z-index: 4;
  }

  .finished-pocket.pocket-highlight {
    border-color: var(--done-green);
    transform: scale(1.03);
  }

  .pocket-title {
    position: relative;
    z-index: 5;
    font-size: clamp(1.2rem, 2.1vh, 1.65rem);
    font-weight: 900;
    color: #ffffff;
    background: #16a34a;
    padding: clamp(8px, 1.2vh, 12px) clamp(16px, 1.8vw, 24px);
    border-radius: 16px;
    border: 3px solid #ffffff;
    box-shadow: 0 5px 0 #15803d, 0 8px 16px rgba(0,0,0,0.18);
    white-space: nowrap;
  }

  .pocket-title.pocket-catch-bounce,
  .pocket-mini-card.pocket-catch-bounce {
    animation: pocketCatch 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pocketCatch {
    0% { transform: scale(1); }
    40% { transform: scale(1.16) translateY(-8px); }
    75% { transform: scale(0.95) translateY(2px); }
    100% { transform: scale(1) translateY(0); }
  }

  .pocket-items {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 14px;
    overflow-x: auto;
    align-items: center;
    flex: 1;
    height: 100%;
    padding: 2px 6px;
  }

  .pocket-mini-card {
    height: 96%;
    aspect-ratio: 0.85 / 1;
    background: #ffffff;
    padding: 5px;
    border-radius: 12px;
    border: 3px solid var(--done-green);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    flex-shrink: 0;
    box-shadow: 0 6px 12px rgba(0,0,0,0.18);
    transform: rotate(-2deg);
  }

  .pocket-mini-card:nth-child(even) {
    transform: rotate(2deg);
  }

  .pocket-mini-card img {
    width: 100%;
    height: 76%;
    object-fit: cover;
    border-radius: 7px;
  }

  .pocket-mini-card span {
    display: block;
    font-size: clamp(0.75rem, 1.35vh, 1rem);
    font-weight: 900;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-align: center;
  }

  /* ==========================================================================
   * 獨立全螢幕畫面：小任務計次格 (Counter Board View)
   * ========================================================================== */
  .counter-board-view {
    display: none;
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 25%, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
    z-index: 60;
    flex-direction: column;
  }

  .counter-board-view.show {
    display: flex;
  }

  .counter-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: clamp(8px, 1.2vh, 14px) clamp(14px, 2vw, 28px) 0;
    padding: 10px 20px;
    background: var(--bar-bg);
    backdrop-filter: blur(8px);
    border: 3px solid var(--bar-border);
    border-radius: 22px;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    gap: 12px;
    flex-wrap: wrap;
  }

  .counter-size-pills {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .size-pill {
    border: 2px solid #cbd5e1;
    background: #ffffff;
    color: var(--text-dark);
    font-size: clamp(0.9rem, 1.5vh, 1.15rem);
    font-weight: 900;
    padding: 6px 14px;
    border-radius: 12px;
    box-shadow: 0 4px 0 #cbd5e1;
    cursor: pointer;
  }

  .size-pill.active {
    background: #0ea5e9;
    color: #ffffff;
    border-color: #0284c7;
    box-shadow: 0 4px 0 #0369a1;
  }

  .counter-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(24px, 4vw, 60px);
    padding: 2vh 4vw;
    flex-wrap: wrap;
  }

  .counter-task-card {
    position: relative;
    width: clamp(220px, 26vw, 350px);
    background: #ffffff;
    border-radius: 26px;
    padding: 16px;
    border: 6px solid var(--active-border);
    box-shadow: 0 14px 0 var(--active-lip), 0 24px 44px rgba(0,0,0,0.22);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .counter-task-card:active {
    transform: translateY(6px);
  }

  .counter-task-card .card-img-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
  }

  .counter-task-card .card-label {
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    margin-top: 12px;
  }

  .counter-slots-board {
    flex: 1;
    max-width: 820px;
    min-width: 300px;
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(8px);
    border: 5px solid #ffffff;
    border-radius: 32px;
    padding: clamp(22px, 3.5vh, 42px);
    box-shadow: 0 14px 0 #cbd5e1, 0 22px 40px rgba(15, 23, 42, 0.14);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }

  .counter-slots-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: clamp(14px, 2vw, 26px);
    width: 100%;
  }

  .counter-slot {
    width: clamp(92px, 11vw, 146px);
    height: clamp(92px, 11vw, 146px);
    border-radius: 50%;
    background: #e2e8f0;
    border: 5px solid #94a3b8;
    box-shadow: inset 0 6px 12px rgba(15, 23, 42, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
  }

  .slot-number {
    font-size: clamp(2rem, 3.4vw, 3.2rem);
    font-weight: 900;
    color: #94a3b8;
    pointer-events: none;
  }

  .slot-token-stamp {
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
    border: 6px solid #ffffff;
    box-shadow: 0 8px 0 #15803d, 0 12px 22px rgba(22, 163, 74, 0.45);
    color: #ffffff;
    font-size: clamp(2.6rem, 4.4vw, 4rem);
    font-weight: 900;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .counter-slot.is-filled .slot-token-stamp {
    display: flex;
    animation: tokenLandBounce 0.36s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .counter-slots-grid.all-completed .counter-slot.is-filled .slot-token-stamp {
    animation: allCompletePulse 0.75s ease-in-out infinite alternate;
    box-shadow: 0 8px 0 #15803d, 0 0 0 10px rgba(34, 197, 94, 0.38);
  }

  @keyframes tokenLandBounce {
    0% { transform: scale(1.4); }
    60% { transform: scale(0.9); }
    100% { transform: scale(1); }
  }

  @keyframes allCompletePulse {
    0% { transform: scale(1) translateY(0); }
    100% { transform: scale(1.08) translateY(-6px); }
  }

  .flying-token-clone {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    border-radius: 50%;
    background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
    border: 6px solid #ffffff;
    box-shadow: 0 16px 32px rgba(0,0,0,0.35);
    color: #ffffff;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    will-change: transform;
  }

  .counter-action-bar {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    min-height: 58px;
    align-items: center;
  }

  /* 彈出視窗共用樣式 */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-backdrop.show {
    display: flex;
  }

  .modal-box {
    background: #ffffff;
    border-radius: 26px;
    border: 5px solid #e2e8f0;
    max-width: 580px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.35);
    text-align: center;
  }

  .modal-title {
    font-size: 1.45rem;
    font-weight: 900;
    margin: 0 0 14px 0;
  }

  .edit-input {
    width: 100%;
    font-size: 1.8rem;
    font-weight: 800;
    text-align: center;
    padding: 10px;
    border: 3px solid #0284c7;
    border-radius: 14px;
    margin-bottom: 14px;
  }

  .quick-words {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 18px;
  }

  .word-chip {
    background: #f1f5f9;
    border: 2px solid #cbd5e1;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
  }

  .word-chip:hover {
    background: #e0f2fe;
    border-color: #0284c7;
  }

  .camera-viewfinder {
    width: 100%;
    max-width: 280px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 12px auto;
    background: #0f172a;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    border: 4px solid #cbd5e1;
  }

  .camera-viewfinder video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .preset-photo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
    margin-bottom: 14px;
  }

  .preset-photo-item {
    border: 2px solid #cbd5e1;
    border-radius: 12px;
    padding: 4px;
    cursor: pointer;
    background: #f8fafc;

  .preset-photo-item:hover {
    border-color: #0284c7;

  .preset-photo-item img {

  .preset-photo-item span {
    display: block;
    font-size: 0.85rem;

  }

  .reward-photo-large {
    width: 190px;
    height: 190px;
    border-radius: 20px;
    object-fit: cover;
    border: 6px solid var(--done-green);
    box-shadow: 0 10px 24px rgba(22, 163, 74, 0.3);
    margin-bottom: 10px;
  }

  .pie-timer-wrap {
    margin: 14px auto;
    width: 155px;
    height: 155px;
    border-radius: 50%;
    background: conic-gradient(#ef4444 var(--pie-deg, 360deg), #e2e8f0 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 6px solid #1e293b;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
  }

  .pie-timer-inner {
    width: 98px;
    height: 98px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.55rem;
    font-weight: 900;
  }
</style>
</head>
<body class="mode-token">

  <!-- 全螢幕物理彩紙特效畫布 -->
  <canvas id="fxCanvas"></canvas>

  <!-- 頂部懸浮圓角工具欄 -->
  <div class="top-bar-wrap">
    <div class="top-bar">
      <div class="board-title" id="boardTitle" onclick="Controllers.openTitleEdit()">今日訓練流程</div>

      <div class="teacher-controls">
        <button class="btn btn-counter-tool" onclick="CounterModule.openStandalone()">打開：小任務計次格</button>
        <button class="btn teacher-only" onclick="Controllers.toggleReorderMode()" id="reorderBtn">調動次序</button>
        <button class="btn teacher-only" onclick="Controllers.cycleTheme()" id="themeBtn">主題：晴空藍</button>
        <button class="btn teacher-only" onclick="Controllers.toggleMode()" id="modeBtn">模式：過關線</button>
        <button class="btn teacher-only" onclick="Controllers.addStep()">+ 加卡</button>
        <button class="btn teacher-only" onclick="Controllers.removeStep()">- 減卡</button>
        <button class="btn teacher-only" onclick="Controllers.resetProgress()">重設進度</button>
        <button class="btn teacher-only" onclick="Controllers.restoreDefaultCards()">還原預設圖</button>
        <button class="btn teacher-only" onclick="Controllers.toggleSound()" id="soundBtn">音效：開</button>
        <button class="btn teacher-only" onclick="Controllers.toggleFullScreen()">全螢幕</button>
        <button class="btn" id="cleanModeBtn" onclick="Controllers.toggleCleanMode()">隱藏工具</button>
      </div>
    </div>
  </div>

  <!-- 調動次序模式提示條 -->
  <div class="reorder-banner" id="reorderBanner">
    調動次序模式：請先撳第 1 張卡，再撳第 2 張卡即可對調位置（或直接拖曳圖卡）
  </div>

  <!-- 中央主工作區（流程板） -->
  <div class="main-workspace" id="mainWorkspace">
    <!-- 3D 踏腳石能量管道 -->
    <div class="token-track-wrapper" id="tokenTrackWrapper">
      <div class="token-lane" id="tokenLane">
        <div class="track-pipe-bg">
          <div class="track-pipe-fill" id="trackPipeFill"></div>
        </div>
        <div class="track-nodes-layer" id="trackNodesLayer"></div>
        <div class="photo-token" id="photoToken" onclick="Controllers.openCameraForToken()" title="撳一下換小朋友相片">
          <img id="tokenImg" src="https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?auto=format&fit=crop&w=400&q=80" alt="棋子">
        </div>
      </div>
    </div>

    <!-- 3D 玩具磚相片卡主畫面 -->
    <div class="schedule-stage" id="scheduleStage"></div>
  </div>

  <!-- 底部 3D 立體開口收納盒（完成袋） -->
  <div class="bottom-tray-area">
    <div class="finished-pocket" id="finishedPocket">
      <div class="pocket-title" id="pocketTitle">完成袋</div>
      <div class="pocket-items" id="pocketItems"></div>
    </div>
  </div>

  <!-- ========================================================================
       獨立全螢幕畫面：小任務計次格 (Counter Board View)
       ======================================================================== -->
  <div class="counter-board-view" id="counterBoardView">
    <div class="counter-top-bar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="btn" onclick="CounterModule.close()">← 返回流程板</button>
        <span style="font-size:clamp(1.2rem, 2vh, 1.6rem); font-weight:900;">小任務計次格</span>
      </div>

      <div class="counter-size-pills teacher-only" id="counterSizePills">
        <span style="font-weight:900; font-size:0.95rem;">目標次數：</span>
        <button class="size-pill" onclick="CounterModule.setTarget(3)">3次</button>
        <button class="size-pill" onclick="CounterModule.setTarget(4)">4次</button>
        <button class="size-pill active" onclick="CounterModule.setTarget(5)">5次</button>
        <button class="size-pill" onclick="CounterModule.setTarget(6)">6次</button>
        <button class="size-pill" onclick="CounterModule.setTarget(8)">8次</button>
        <button class="size-pill" onclick="CounterModule.setTarget(10)">10次</button>
        <button class="btn" onclick="CounterModule.resetCount()">重設</button>
      </div>
    </div>

    <div class="counter-stage">
      <!-- 左邊：任務相片大卡 -->
      <div class="counter-task-card" id="counterTaskCard" onclick="CounterModule.addOneStep()">

        <div class="card-img-box">
          <img id="counterTaskImg" src="" alt="任務">
        </div>
        <div class="card-label" id="counterTaskLabel" onclick="Controllers.openLabelEdit(event, 'counter')">穿珠</div>
      </div>

      <!-- 右邊：立體計次格盤 -->
      <div class="counter-slots-board">
        <div class="counter-slots-grid" id="counterSlotsGrid"></div>

        <div class="counter-action-bar" id="counterActionBar">
          <button class="btn" onclick="CounterModule.undoOneStep()">- 退後一格</button>
          <button class="btn" onclick="CounterModule.resetCount()">重設 0 次</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 1. 直接改字彈窗 -->
  <div class="modal-backdrop" id="editModal">
    <div class="modal-box">
      <h3 class="modal-title">修改文字</h3>
      <input type="text" class="edit-input" id="editInput" maxlength="8">
      <div class="quick-words" id="quickWords"></div>
      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-primary" onclick="Controllers.saveLabelEdit()">儲存</button>
        <button class="btn" onclick="Controllers.closeEditModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- 2. 即場實時相機 ＋ 內置真實教具相庫彈窗 -->
  <div class="modal-backdrop" id="cameraModal">
    <div class="modal-box">
      <h3 class="modal-title" id="camModalTitle">即場影相 / 揀選真實教具相</h3>

      <div class="camera-viewfinder">
        <video id="cameraVideo" autoplay playsinline muted></video>
      </div>

      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;">
        <button class="btn btn-camera" onclick="Controllers.capturePhoto()">撳快門影相</button>
        <button class="btn" onclick="Controllers.switchCamera()">切換前後鏡</button>
        <label class="btn btn-primary" style="margin:0;">
          上傳電腦/相簿相片
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="Controllers.handleFileUpload(event)">
        </label>
      </div>

      <div style="font-weight:800; font-size:0.95rem; color:#475569; margin-bottom:6px;">
        或者一撳揀選內置真實教具相片：
      </div>
      <div class="preset-photo-grid" id="presetPhotoGrid"></div>

      <button class="btn" onclick="Controllers.closeCameraModal()">關閉</button>
    </div>

  <!-- 3. 最終大獎勵慶祝 ＋ 視覺圓餅倒數計時器 -->
  <div class="modal-backdrop" id="rewardModal">
    <div class="modal-box">
      <h2 style="font-size:2.1rem; margin:0 0 10px 0; color:#16a34a;">好叻呀！全部完成！</h2>
      <img id="rewardModalImg" class="reward-photo-large" src="" alt="獎勵">
      <div id="rewardModalLabel" style="font-size:2.1rem; font-weight:900; margin-bottom:6px;"></div>

      <div class="pie-timer-wrap" id="pieTimer">
        <div class="pie-timer-inner" id="timerText">01:00</div>
      </div>

      <div style="display:flex; gap:8px; justify-content:center; margin-bottom:14px;">
        <button class="btn" onclick="Controllers.startRewardTimer(60)">1分鐘</button>
        <button class="btn" onclick="Controllers.startRewardTimer(120)">2分鐘</button>
        <button class="btn" onclick="Controllers.startRewardTimer(180)">3分鐘</button>
      </div>

      <button class="btn btn-success" onclick="Controllers.finishSession()">收玩具 / 開始新一輪</button>
    </div>
  </div>

<script>
/**
 * ============================================================================
 * 【模組 1：預設資料庫 AppConfig】
 * ============================================================================
 */
const AppConfig = {
  STORAGE_KEY: "sccw_steps_v6",
  themes: [
    { id: "",            name: "晴空藍" },
    { id: "theme-mint",  name: "森林綠" },
    { id: "theme-peach", name: "暖陽橙" },
    { id: "theme-wood",  name: "木紋室" }
  ],
  presetPhotos: [
    { label: "拼圖", img: "https://images.unsplash.com/photo-1587654780291-39c9404d746b?auto=format&fit=crop&w=600&q=80" },
    { label: "穿珠", img: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=600&q=80" },
    { label: "睇書", img: "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=600&q=80" },
    { label: "積木", img: "https://images.unsplash.com/photo-1585366119957-e9730b6d0f60?auto=format&fit=crop&w=600&q=80" },
    { label: "塗色", img: "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=600&q=80" },
    { label: "玩車", img: "https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?auto=format&fit=crop&w=600&q=80" },
    { label: "泥膠", img: "https://images.unsplash.com/photo-1560421683-6856ea585c78?auto=format&fit=crop&w=600&q=80" },
    { label: "執拾", img: "https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?auto=format&fit=crop&w=600&q=80" },
    { label: "洗手", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&w=600&q=80" },
    { label: "飲水", img: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?auto=format&fit=crop&w=600&q=80" },
    { label: "吹泡泡", img: "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=600&q=80" },
    { label: "小食", img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=600&q=80" }
  ],
  quickWordsList: [
    "拼圖", "穿珠", "認卡", "發音", "睇書", "連線",
    "大肌", "執拾", "洗手", "抹面", "飲水", "坐好",
    "玩車", "吹泡泡", "積木", "泥膠", "貼紙", "小食"
  ],
  getDefaultSteps() {
    return [
      { label: "拼圖", img: this.presetPhotos[0].img, isReward: false },
      { label: "穿珠", img: this.presetPhotos[1].img, isReward: false },
      { label: "積木", img: this.presetPhotos[3].img, isReward: false },
      { label: "玩車", img: this.presetPhotos[5].img, isReward: true }
    ];
  }
};

/**
 * ============================================================================
 * 【模組 2：狀態與資料管理 AppState】
 * ============================================================================
 */
const AppState = {
  steps: [],
  currentIndex: 0,
  themeIndex: 0,
  isAnimating: false,
  soundEnabled: true,
  isTokenMode: true,
  isReorderMode: false,
  swapSourceIdx: null,
  dragSourceIdx: null,
  editingIndex: null,
  cameraTargetIndex: null,
  videoStream: null,
  useFrontCamera: false,
  timerInterval: null,

  init() {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    const raw = localStorage.getItem(AppConfig.STORAGE_KEY);
    if (raw) {
      try {
        this.steps = JSON.parse(raw);
      } catch (e) {
        this.steps = AppConfig.getDefaultSteps();
      }
    } else {
      this.steps = AppConfig.getDefaultSteps();
    }
    Engine.initConfettiCanvas();
  },

  save() {
    localStorage.setItem(AppConfig.STORAGE_KEY, JSON.stringify(this.steps));
  }
};

/**
 * ============================================================================
 * 【模組 3：音效、物理彩紙與轉場動畫引擎 Engine】
 * ============================================================================
 */
const Engine = {
  particles: [],
  canvas: null,
  ctx: null,
  animFrameId: null,

  initConfettiCanvas() {
    this.canvas = document.getElementById("fxCanvas");
    this.ctx = this.canvas.getContext("2d");
    const resize = () => {
      this.canvas.width = window.innerWidth;
      this.canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener("resize", resize);
  },

  burstConfetti(x, y, count = 42) {
    const colors = ["#f59e0b", "#10b981", "#0ea5e9", "#ec4899", "#eab308", "#8b5cf6"];
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const speed = 5 + Math.random() * 11;
      this.particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        w: 8 + Math.random() * 8,
        h: 6 + Math.random() * 6,
        color: colors[i % colors.length],
        rot: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.25,
        alpha: 1
      });
    }
    if (!this.animFrameId) this.loopParticles();
  },

  loopParticles() {
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.38;
      p.vx *= 0.98;
      p.rot += p.vRot;
      p.alpha -= 0.014;

      if (p.alpha <= 0 || p.y > this.canvas.height + 30) {
        this.particles.splice(i, 1);
        continue;
      }

      this.ctx.save();
      this.ctx.globalAlpha = Math.max(0, p.alpha);
      this.ctx.translate(p.x, p.y);
      this.ctx.rotate(p.rot);
      this.ctx.fillStyle = p.color;
      this.ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      this.ctx.restore();
    }

    if (this.particles.length > 0) {
      this.animFrameId = requestAnimationFrame(() => this.loopParticles());
    } else {
      this.animFrameId = null;
    }
  },

  playSubstepSound(stepNum) {
    if (!AppState.soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const scaleFreqs = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5];
      const freq = scaleFreqs[(stepNum - 1) % scaleFreqs.length];
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.22);
    } catch (e) {}
  },

  playChime(isFinal = false) {
    if (!AppState.soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = isFinal ? [523.25, 659.25, 783.99, 1046.5] : [587.33, 880];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.12);
        osc.stop(ctx.currentTime + idx * 0.12 + 0.35);
      });
    } catch (e) {}
  },

  playPocketCatchSound() {
    if (!AppState.soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(320, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(640, ctx.currentTime + 0.16);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) {}
  },

  playSwapSound() {
    if (!AppState.soundEnabled) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(660, ctx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.16, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.2);
    } catch (e) {}
  },

  // 兩張相片卡「上弧線＋下弧線立體交叉換位」動畫
  animateCardSwap(idxA, idxB, onComplete) {
    const cardsBefore = document.querySelectorAll(".photo-card");
    const rectA = cardsBefore[idxA].getBoundingClientRect();
    const rectB = cardsBefore[idxB].getBoundingClientRect();

    const tempLabel = AppState.steps[idxA].label;
    const tempImg = AppState.steps[idxA].img;
    AppState.steps[idxA].label = AppState.steps[idxB].label;
    AppState.steps[idxA].img = AppState.steps[idxB].img;
    AppState.steps[idxB].label = tempLabel;
    AppState.steps[idxB].img = tempImg;

    AppState.save();
    Renderer.renderBoard(false);
    this.playSwapSound();

    const cardsAfter = document.querySelectorAll(".photo-card");
    const newElA = cardsAfter[idxA];
    const newElB = cardsAfter[idxB];

    const dxA = rectB.left - rectA.left;
    const dxB = rectA.left - rectB.left;

    const framesA = [];
    const framesB = [];
    const stepsCount = 20;
    for (let i = 0; i <= stepsCount; i++) {
      const t = i / stepsCount;
      const invT = 1 - t;
      const curXA = dxA * invT;
      const curYA = -Math.sin(t * Math.PI) * 52;
      const curXB = dxB * invT;
      const curYB = Math.sin(t * Math.PI) * 52;
      const scale = 1 + Math.sin(t * Math.PI) * 0.1;

      framesA.push({ transform: `translate3d(${curXA.toFixed(1)}px, ${curYA.toFixed(1)}px, 0) scale(${scale.toFixed(2)})` });
      framesB.push({ transform: `translate3d(${curXB.toFixed(1)}px, ${curYB.toFixed(1)}px, 0) scale(${scale.toFixed(2)})` });
    }

    newElA.style.zIndex = "20";
    newElB.style.zIndex = "19";

    const animA = newElA.animate(framesA, {
      duration: 440,
      easing: "cubic-bezier(0.22, 0.61, 0.36, 1)"
    });
    newElB.animate(framesB, {
      duration: 440,
      easing: "cubic-bezier(0.22, 0.61, 0.36, 1)"
    });

    animA.onfinish = () => {
      newElA.style.zIndex = "";
      newElB.style.zIndex = "";
      if (onComplete) onComplete();
    };
  },

  // 流程板：相片卡拋物線飛入立體完成袋
  animateCardFlyToPocket(sourceCardEl, stepData, onComplete) {
    const pocket = document.getElementById("pocketItems");
    const pocketBar = document.getElementById("finishedPocket");
    const pocketTitle = document.getElementById("pocketTitle");

    const targetMini = document.createElement("div");
    targetMini.className = "pocket-mini-card";
    targetMini.style.opacity = "0";
    targetMini.innerHTML = `
      <img src="${stepData.img}" alt="${stepData.label}">
      <span>${stepData.label}</span>
    `;
    pocket.appendChild(targetMini);

    const srcRect = sourceCardEl.getBoundingClientRect();
    const destRect = targetMini.getBoundingClientRect();

    this.burstConfetti(srcRect.left + srcRect.width / 2, srcRect.top + srcRect.height / 2, 36);

    const clone = document.createElement("div");
    clone.className = "flying-card-clone";
    clone.style.left = `${srcRect.left}px`;
    clone.style.top = `${srcRect.top}px`;
    clone.style.width = `${srcRect.width}px`;
    clone.style.height = `${srcRect.height}px`;
    clone.innerHTML = `
      <div class="card-img-box">
        <img src="${stepData.img}" alt="${stepData.label}" style="width:100%;height:100%;object-fit:cover;display:block;">
      </div>
      <div class="card-label">${stepData.label}</div>
    `;
    document.body.appendChild(clone);

    const dx = destRect.left - srcRect.left;
    const dy = destRect.top - srcRect.top;
    const targetScale = destRect.height / srcRect.height;

    const ctrlX = dx * 0.32;
    const ctrlY = -Math.max(120, srcRect.height * 0.45);

    const keyframes = [];
    const totalFrames = 28;
    for (let i = 0; i <= totalFrames; i++) {
      const t = i / totalFrames;
      const invT = 1 - t;
      const x = 2 * invT * t * ctrlX + (t * t) * dx;
      const y = 2 * invT * t * ctrlY + (t * t) * dy;
      const scale = 1.06 * invT + targetScale * t;
      const rotate = Math.sin(t * Math.PI) * (dx < 0 ? -9 : 9);

      keyframes.push({
        transform: `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${scale.toFixed(3)}) rotate(${rotate.toFixed(2)}deg)`,
        opacity: t > 0.92 ? 0.92 : 1
      });
    }

    pocketBar.classList.add("pocket-highlight");

    const anim = clone.animate(keyframes, {
      duration: 780,
      easing: "cubic-bezier(0.22, 0.61, 0.36, 1)",
      fill: "forwards"
    });

    anim.onfinish = () => {
      clone.remove();
      targetMini.style.opacity = "1";
      targetMini.classList.add("pocket-catch-bounce");
      pocketTitle.classList.add("pocket-catch-bounce");
      pocketBar.classList.remove("pocket-highlight");
      this.playPocketCatchSound();

      setTimeout(() => {
        pocketTitle.classList.remove("pocket-catch-bounce");
      }, 450);

      if (onComplete) onComplete();
    };
  },

  animateTokenFlyToSlot(sourceEl, targetSlotEl, onComplete) {
    const srcRect = sourceEl.getBoundingClientRect();
    const destRect = targetSlotEl.getBoundingClientRect();

    const size = destRect.width;
    const startX = srcRect.left + srcRect.width / 2 - size / 2;
    const startY = srcRect.top + srcRect.height / 2 - size / 2;
    const dx = destRect.left - startX;
    const dy = destRect.top - startY;

    const clone = document.createElement("div");
    clone.className = "flying-token-clone";
    clone.style.width = `${size}px`;
    clone.style.height = `${size}px`;
    clone.style.left = `${startX}px`;
    clone.style.top = `${startY}px`;
    clone.style.fontSize = `${size * 0.55}px`;
    clone.textContent = "✔";
    document.body.appendChild(clone);

    const ctrlX = dx * 0.45;
    const ctrlY = -Math.max(95, Math.abs(dy) * 0.5 + 80);

    const keyframes = [];
    const frames = 22;
    for (let i = 0; i <= frames; i++) {
      const t = i / frames;
      const invT = 1 - t;
      const x = 2 * invT * t * ctrlX + (t * t) * dx;
      const y = 2 * invT * t * ctrlY + (t * t) * dy;
      const scale = 0.75 + Math.sin(t * Math.PI) * 0.45 + (t * 0.25);

      keyframes.push({
        transform: `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${scale.toFixed(2)})`
      });
    }

    const anim = clone.animate(keyframes, {
      duration: 460,
      easing: "cubic-bezier(0.22, 0.61, 0.36, 1)",
      fill: "forwards"
    });

    anim.onfinish = () => {
      clone.remove();
      this.burstConfetti(destRect.left + destRect.width / 2, destRect.top + destRect.height / 2, 24);
      if (onComplete) onComplete();
    };
  }
};

/**
 * ============================================================================
 * 【模組 4：畫面渲染器 Renderer（流程板與踏腳石管道）】
 * ============================================================================
 */
const Renderer = {
  adjustLayoutToScreen(triggerHop = false) {
    const workspace = document.getElementById("mainWorkspace");
    if (!workspace) return;

    const availW = workspace.clientWidth * 0.94;
    const availH = workspace.clientHeight;
    const count = AppState.steps.length;

    const gap = Math.max(16, Math.min(38, Math.floor(availW * 0.024)));
    const maxCardByWidth = (availW - gap * (count - 1)) / (count + 0.25);
    const heightRatio = AppState.isTokenMode ? 0.55 : 0.70;
    const maxCardByHeight = availH * heightRatio;

    const cardSize = Math.floor(Math.max(130, Math.min(maxCardByWidth, maxCardByHeight, 400)));
    const tokenSize = Math.floor(Math.max(58, Math.min(cardSize * 0.35, 106)));
    const totalTrackWidth = cardSize * count + gap * (count - 1);

    document.documentElement.style.setProperty("--card-size", `${cardSize}px`);
    document.documentElement.style.setProperty("--card-gap", `${gap}px`);
    document.documentElement.style.setProperty("--token-size", `${tokenSize}px`);
    document.documentElement.style.setProperty("--track-width", `${totalTrackWidth}px`);

    setTimeout(() => this.updateSteppingStonesAndToken(triggerHop), 35);
  },

  updateSteppingStonesAndToken(triggerHop = false) {
    if (!AppState.isTokenMode) return;
    const cards = document.querySelectorAll(".photo-card");
    const token = document.getElementById("photoToken");
    const lane = document.getElementById("tokenLane");
    const nodesLayer = document.getElementById("trackNodesLayer");
    const pipeFill = document.getElementById("trackPipeFill");
    if (!cards.length || !token || !lane || !nodesLayer) return;

    nodesLayer.innerHTML = "";

    const centers = [];
    cards.forEach((card, idx) => {
      const centerX = card.offsetLeft - lane.offsetLeft + card.offsetWidth / 2;
      centers.push(centerX);

      const stone = document.createElement("div");
      let stoneState = "";
      if (idx < AppState.currentIndex) stoneState = "stone-done";
      else if (idx === AppState.currentIndex) stoneState = "stone-current";

      stone.className = `track-stone ${stoneState}`;
      stone.style.left = `${centerX}px`;
      stone.textContent = idx < AppState.currentIndex ? "✔" : (idx + 1);
      nodesLayer.appendChild(stone);
    });

    const maxIdx = Math.max(1, cards.length - 1);
    const activeIdx = Math.min(AppState.currentIndex, cards.length - 1);
    const fillPercent = (activeIdx / maxIdx) * 100;
    pipeFill.style.width = `${fillPercent}%`;

    const tokenW = token.offsetWidth || 80;
    const targetLeft = centers[activeIdx] - tokenW / 2;
    token.style.left = `${targetLeft}px`;

    if (triggerHop) {
      token.classList.remove("token-hopping");
      void token.offsetWidth;
      token.classList.add("token-hopping");
    }
  },

  renderBoard(triggerHop = false) {
    const stage = document.getElementById("scheduleStage");
    const pocket = document.getElementById("pocketItems");
    stage.innerHTML = "";
    pocket.innerHTML = "";

    AppState.steps.forEach((step, idx) => {
      const card = document.createElement("div");
      let stateClass = "is-upcoming";
      if (idx < AppState.currentIndex) stateClass = "is-done";
      else if (idx === AppState.currentIndex) stateClass = "is-current";

      const isSwapSelected = AppState.swapSourceIdx === idx;
      card.className = `photo-card ${stateClass} ${step.isReward ? "is-reward" : ""} ${isSwapSelected ? "swap-selected" : ""}`;
      card.onclick = () => Controllers.handleCardTap(idx);

      // 支援滑鼠直接拖曳換位（只限未完成嘅卡）
      if (idx >= AppState.currentIndex) {
        card.draggable = true;
        card.ondragstart = (e) => Controllers.handleDragStart(e, idx);
        card.ondragover = (e) => Controllers.handleDragOver(e, card, idx);
        card.ondragleave = () => card.classList.remove("drag-over-target");
        card.ondrop = (e) => Controllers.handleDrop(e, card, idx);
      }

      // 左上角：計次掣
      const openCounterBtn = step.isReward
        ? ""
        : `<button class="card-open-counter-btn teacher-only" onclick="CounterModule.openForStep(event, ${idx})" title="打開呢張卡嘅小任務計次格">計次</button>`;

      // 底部左右換位箭咀
      const minSwappableIdx = AppState.currentIndex;
      const maxSwappableIdx = AppState.isReorderMode ? AppState.steps.length - 1 : AppState.steps.length - 2;
      const canMoveLeft = idx > minSwappableIdx && idx <= maxSwappableIdx;
      const canMoveRight = idx >= minSwappableIdx && idx < maxSwappableIdx;

      const leftArrowHtml = (idx >= AppState.currentIndex && (!step.isReward || AppState.isReorderMode))
        ? `<button class="swap-arrow-btn teacher-only" ${canMoveLeft ? "" : "disabled"} onclick="Controllers.swapAdjacent(event, ${idx}, ${idx - 1})" title="向左調前">◀</button>`
        : "";

      const rightArrowHtml = (idx >= AppState.currentIndex && (!step.isReward || AppState.isReorderMode))
        ? `<button class="swap-arrow-btn teacher-only" ${canMoveRight ? "" : "disabled"} onclick="Controllers.swapAdjacent(event, ${idx}, ${idx + 1})" title="向右調後">▶</button>`
        : "";

      card.innerHTML = `
        ${openCounterBtn}
        <button class="card-cam-btn teacher-only" onclick="Controllers.openCameraModal(event, ${idx})">影相</button>
        <div class="card-img-box">
          <img src="${step.img}" alt="${step.label}">
          <div class="done-stamp">
            <div class="done-check">✔</div>
          </div>
        </div>
        <div class="card-footer-row">
          ${leftArrowHtml}
          <div class="card-label" onclick="Controllers.openLabelEdit(event, ${idx})">${step.label}</div>
          ${rightArrowHtml}
        </div>
      `;
      stage.appendChild(card);

      if (idx < AppState.currentIndex) {
        const mini = document.createElement("div");
        mini.className = "pocket-mini-card";
        mini.innerHTML = `
          <img src="${step.img}" alt="${step.label}">
          <span>${step.label}</span>
        `;
        pocket.appendChild(mini);
      }
    });

    this.adjustLayoutToScreen(triggerHop);
  }
};

/**
 * ============================================================================
 * 【模組 5：老師控制與流程板互動邏輯 Controllers】
 * ============================================================================
 */
const Controllers = {
  handleCardTap(idx) {
    if (AppState.isAnimating) return;

    // 調動次序模式：撳兩張卡直接對調位置
    if (AppState.isReorderMode) {
      if (idx < AppState.currentIndex) return;
      if (AppState.swapSourceIdx === null) {
        AppState.swapSourceIdx = idx;
        Renderer.renderBoard(false);
      } else if (AppState.swapSourceIdx === idx) {
        AppState.swapSourceIdx = null;
        Renderer.renderBoard(false);
      } else {
        const firstIdx = AppState.swapSourceIdx;
        AppState.swapSourceIdx = null;
        this.performSwap(firstIdx, idx);
      }
      return;
    }

    // 正常過關模式：只開放當前步驟點擊
    if (idx !== AppState.currentIndex) return;

    AppState.isAnimating = true;
    const cards = document.querySelectorAll(".photo-card");
    const clickedCardEl = cards[idx];
    const completedStep = AppState.steps[AppState.currentIndex];

    clickedCardEl.classList.remove("is-current");
    clickedCardEl.classList.add("is-stamping");
    Engine.playChime(AppState.currentIndex === AppState.steps.length - 1);

    setTimeout(() => {
      clickedCardEl.classList.remove("is-stamping");
      clickedCardEl.classList.add("is-done");

      Engine.animateCardFlyToPocket(clickedCardEl, completedStep, () => {
        AppState.currentIndex++;
        Renderer.renderBoard(true);
        AppState.isAnimating = false;

        if (AppState.currentIndex >= AppState.steps.length) {
          Engine.burstConfetti(window.innerWidth / 2, window.innerHeight / 3, 70);
          this.showRewardModal(completedStep);
        }
      });
    }, 260);
  },

  toggleReorderMode() {
    if (AppState.isAnimating) return;
    AppState.isReorderMode = !AppState.isReorderMode;
    AppState.swapSourceIdx = null;
    document.body.classList.toggle("reorder-mode", AppState.isReorderMode);
    const btn = document.getElementById("reorderBtn");
    btn.textContent = AppState.isReorderMode ? "完成調序 ✔" : "調動次序";
    btn.classList.toggle("btn-reorder-active", AppState.isReorderMode);
    Renderer.renderBoard(false);
  },

  performSwap(idxA, idxB) {
    if (AppState.isAnimating || idxA === idxB) return;
    if (idxA < AppState.currentIndex || idxB < AppState.currentIndex) return;
    AppState.isAnimating = true;
    Engine.animateCardSwap(idxA, idxB, () => {
      AppState.isAnimating = false;
    });
  },

  swapAdjacent(e, idxA, idxB) {
    e.stopPropagation();
    this.performSwap(idxA, idxB);
  },

  handleDragStart(e, idx) {
    if (AppState.isAnimating || idx < AppState.currentIndex) {
      e.preventDefault();
      return;
    }
    AppState.dragSourceIdx = idx;
    e.dataTransfer.effectAllowed = "move";
  },

  handleDragOver(e, cardEl, idx) {
    if (AppState.dragSourceIdx === null || AppState.dragSourceIdx === idx || idx < AppState.currentIndex) return;
    e.preventDefault();
    cardEl.classList.add("drag-over-target");
  },

  handleDrop(e, cardEl, targetIdx) {
    e.preventDefault();
    cardEl.classList.remove("drag-over-target");
    const srcIdx = AppState.dragSourceIdx;
    AppState.dragSourceIdx = null;
    if (srcIdx !== null && srcIdx !== targetIdx && targetIdx >= AppState.currentIndex) {
      this.performSwap(srcIdx, targetIdx);
    }
  },

  cycleTheme() {
    const prevTheme = AppConfig.themes[AppState.themeIndex].id;
    if (prevTheme) document.body.classList.remove(prevTheme);

    AppState.themeIndex = (AppState.themeIndex + 1) % AppConfig.themes.length;
    const nextTheme = AppConfig.themes[AppState.themeIndex];
    if (nextTheme.id) document.body.classList.add(nextTheme.id);

    document.getElementById("themeBtn").textContent = `主題：${nextTheme.name}`;
  },

  toggleMode() {
    AppState.isTokenMode = !AppState.isTokenMode;
    document.body.classList.toggle("mode-token", AppState.isTokenMode);
    document.getElementById("modeBtn").textContent = AppState.isTokenMode ? "模式：過關線" : "模式：流程板";
    Renderer.adjustLayoutToScreen();
  },

  toggleCleanMode() {
    if (AppState.isReorderMode) this.toggleReorderMode();
    const isClean = document.body.classList.toggle("clean-mode");
    const btn = document.getElementById("cleanModeBtn");
    btn.textContent = isClean ? "顯示工具" : "隱藏工具";
    btn.classList.toggle("btn-lock-active", isClean);
    Renderer.adjustLayoutToScreen();
  },

  toggleSound() {
    AppState.soundEnabled = !AppState.soundEnabled;
    const btn = document.getElementById("soundBtn");
    btn.textContent = AppState.soundEnabled ? "音效：開" : "音效：靜音";
    btn.classList.toggle("btn-lock-active", !AppState.soundEnabled);
  },

  toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  },

  addStep() {
    if (AppState.isAnimating) return;
    if (AppState.steps.length >= 6) return alert("建議最多 6 張卡，保持畫面清晰！");
    const pick = AppConfig.presetPhotos[AppState.steps.length % AppConfig.presetPhotos.length];
    const newCard = {
      label: pick.label,
      img: pick.img,
      isReward: false
    };
    AppState.steps.splice(AppState.steps.length - 1, 0, newCard);
    AppState.save();
    Renderer.renderBoard();
  },

  removeStep() {
    if (AppState.isAnimating) return;
    if (AppState.steps.length <= 2) return alert("最少保留 1 張訓練卡同 1 張獎勵卡！");
    AppState.steps.splice(AppState.steps.length - 2, 1);
    if (AppState.currentIndex >= AppState.steps.length) AppState.currentIndex = 0;
    AppState.save();
    Renderer.renderBoard();
  },

  resetProgress() {
    if (AppState.isAnimating) return;
    AppState.currentIndex = 0;
    AppState.swapSourceIdx = null;
    Renderer.renderBoard();
  },

  restoreDefaultCards() {
    if (AppState.isAnimating) return;
    AppState.steps = AppConfig.getDefaultSteps();
    AppState.currentIndex = 0;
    AppState.swapSourceIdx = null;
    AppState.save();
    Renderer.renderBoard();
  },

  openLabelEdit(e, idx) {
    e.stopPropagation();
    if (AppState.isAnimating) return;
    AppState.editingIndex = idx;
    const input = document.getElementById("editInput");

    if (idx === "counter") {
      input.value = CounterModule.taskLabel;
    } else {
      input.value = AppState.steps[idx].label;
    }

    const chipsBox = document.getElementById("quickWords");
    chipsBox.innerHTML = "";
    AppConfig.quickWordsList.forEach(w => {
      const chip = document.createElement("span");
      chip.className = "word-chip";
      chip.textContent = w;
      chip.onclick = () => { input.value = w; };
      chipsBox.appendChild(chip);
    });

    document.getElementById("editModal").classList.add("show");
    setTimeout(() => input.focus(), 50);
  },

  saveLabelEdit() {
    const val = document.getElementById("editInput").value.trim();
    if (val && AppState.editingIndex !== null) {
      if (AppState.editingIndex === "counter") {
        CounterModule.taskLabel = val;
        if (CounterModule.linkedStepIndex !== null) {
          AppState.steps[CounterModule.linkedStepIndex].label = val;
          AppState.save();
          Renderer.renderBoard();
        }
        CounterModule.render();
      } else {
        AppState.steps[AppState.editingIndex].label = val;
        AppState.save();
        Renderer.renderBoard();
      }
    }
    this.closeEditModal();
  },

  closeEditModal() {
    document.getElementById("editModal").classList.remove("show");
    AppState.editingIndex = null;
  },

  openTitleEdit() {
    const current = document.getElementById("boardTitle").textContent;
    const next = prompt("修改頂部標題：", current);
    if (next && next.trim()) {
      document.getElementById("boardTitle").textContent = next.trim();
    }
  },

  renderPresetGallery() {
    const grid = document.getElementById("presetPhotoGrid");
    grid.innerHTML = "";
    AppConfig.presetPhotos.forEach(item => {
      const div = document.createElement("div");
      div.className = "preset-photo-item";
      div.innerHTML = `<img src="${item.img}" alt="${item.label}"><span>${item.label}</span>`;
      div.onclick = () => {
        if (AppState.cameraTargetIndex === "token") {
          document.getElementById("tokenImg").src = item.img;
        } else if (AppState.cameraTargetIndex === "counter") {
          CounterModule.taskImg = item.img;
          CounterModule.taskLabel = item.label;
          CounterModule.render();
        } else if (AppState.cameraTargetIndex !== null) {
          AppState.steps[AppState.cameraTargetIndex].img = item.img;
          AppState.steps[AppState.cameraTargetIndex].label = item.label;
          AppState.save();
          Renderer.renderBoard();
        }
        this.closeCameraModal();
      };
      grid.appendChild(div);
    });
  },

  async openCameraModal(e, idx) {
    if (e) e.stopPropagation();
    if (AppState.isAnimating) return;
    AppState.cameraTargetIndex = idx;
    document.getElementById("camModalTitle").textContent =
      idx === "token" ? "換過關棋子相片" :
      idx === "counter" ? `換相 / 影相：${CounterModule.taskLabel}` :
      `換相 / 影相：${AppState.steps[idx].label}`;
    this.renderPresetGallery();
    document.getElementById("cameraModal").classList.add("show");
    await this.startCameraStream();
  },

  openCameraForToken() {
    this.openCameraModal(null, "token");
  },

  async startCameraStream() {
    this.stopCameraStream();
    try {
      AppState.videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: AppState.useFrontCamera ? "user" : "environment" },
        audio: false
      });
      document.getElementById("cameraVideo").srcObject = AppState.videoStream;
    } catch (err) {}
  },

  stopCameraStream() {
    if (AppState.videoStream) {
      AppState.videoStream.getTracks().forEach(t => t.stop());
      AppState.videoStream = null;
    }
  },

  switchCamera() {
    AppState.useFrontCamera = !AppState.useFrontCamera;
    this.startCameraStream();
  },

  capturePhoto() {
    const video = document.getElementById("cameraVideo");
    if (!video.videoWidth) {
      alert("偵測唔到鏡頭畫面，請撳右邊「上傳電腦/相簿相片」或者揀下面內置真實教具相片！");
      return;
    }
    const canvas = document.createElement("canvas");
    const size = Math.min(video.videoWidth, video.videoHeight);
    canvas.width = 480;
    canvas.height = 480;
    const ctx = canvas.getContext("2d");
    const sx = (video.videoWidth - size) / 2;
    const sy = (video.videoHeight - size) / 2;
    ctx.drawImage(video, sx, sy, size, size, 0, 0, 480, 480);

    this.applyCapturedDataUrl(canvas.toDataURL("image/jpeg", 0.85));
  },

  handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const size = Math.min(img.width, img.height);
        canvas.width = 480;
        canvas.height = 480;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, 480, 480);
        this.applyCapturedDataUrl(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  },

  applyCapturedDataUrl(dataUrl) {
    if (AppState.cameraTargetIndex === "token") {
      document.getElementById("tokenImg").src = dataUrl;
    } else if (AppState.cameraTargetIndex === "counter") {
      CounterModule.taskImg = dataUrl;
      if (CounterModule.linkedStepIndex !== null) {
        AppState.steps[CounterModule.linkedStepIndex].img = dataUrl;
        AppState.save();
        Renderer.renderBoard();
      }
      CounterModule.render();
    } else if (AppState.cameraTargetIndex !== null) {
      AppState.steps[AppState.cameraTargetIndex].img = dataUrl;
      AppState.save();
      Renderer.renderBoard();
    }
    this.closeCameraModal();
  },

  closeCameraModal() {
    this.stopCameraStream();
    document.getElementById("cameraModal").classList.remove("show");
    AppState.cameraTargetIndex = null;
  },

  showRewardModal(rewardStep) {
    document.getElementById("rewardModalImg").src = rewardStep.img;
    document.getElementById("rewardModalLabel").textContent = rewardStep.label;
    document.getElementById("rewardModal").classList.add("show");
    this.startRewardTimer(60);
  },

  startRewardTimer(seconds) {
    clearInterval(AppState.timerInterval);
    let remaining = seconds;
    this.updatePieUI(remaining, seconds);

    AppState.timerInterval = setInterval(() => {
      remaining--;
      this.updatePieUI(remaining, seconds);
      if (remaining <= 0) {
        clearInterval(AppState.timerInterval);
        Engine.playChime(true);
      }
    }, 1000);
  },

  updatePieUI(rem, total) {
    const deg = Math.max(0, (rem / total) * 360);
    document.getElementById("pieTimer").style.setProperty("--pie-deg", `${deg}deg`);
    const m = String(Math.floor(rem / 60)).padStart(2, "0");
    const s = String(rem % 60).padStart(2, "0");
    document.getElementById("timerText").textContent = `${m}:${s}`;
  },

  finishSession() {
    clearInterval(AppState.timerInterval);
    document.getElementById("rewardModal").classList.remove("show");
    this.resetProgress();
  }
};

/**
 * ============================================================================
 * 【模組 6：獨立小任務計次格 CounterModule】
 * ============================================================================
 */
const CounterModule = {
  isOpen: false,
  targetCount: 5,
  currentCount: 0,
  isFlying: false,
  taskLabel: "穿珠",
  taskImg: AppConfig.presetPhotos[1].img,
  linkedStepIndex: null,

  openStandalone() {
    const activeIdx = Math.min(AppState.currentIndex, AppState.steps.length - 1);
    const activeStep = AppState.steps[activeIdx];
    this.linkedStepIndex = activeIdx;
    this.taskLabel = activeStep.label;
    this.taskImg = activeStep.img;
    this.currentCount = 0;
    this.isOpen = true;
    document.getElementById("counterBoardView").classList.add("show");
    this.render();
  },

  openForStep(e, stepIdx) {
    if (e) e.stopPropagation();
    const step = AppState.steps[stepIdx];
    this.linkedStepIndex = stepIdx;
    this.taskLabel = step.label;
    this.taskImg = step.img;
    this.currentCount = 0;
    this.isOpen = true;
    document.getElementById("counterBoardView").classList.add("show");
    this.render();
  },

  close() {
    this.isOpen = false;
    document.getElementById("counterBoardView").classList.remove("show");
  },

  setTarget(num) {
    if (this.isFlying) return;
    this.targetCount = num;
    this.currentCount = 0;

    const pills = document.querySelectorAll("#counterSizePills .size-pill");
    pills.forEach(p => {
      p.classList.toggle("active", p.textContent === `${num}次`);
    });
    this.render();
  },

  resetCount() {
    if (this.isFlying) return;
    this.currentCount = 0;
    this.render();
  },

  undoOneStep() {
    if (this.isFlying || this.currentCount <= 0) return;
    this.currentCount--;
    this.render();
  },

  addOneStep() {
    if (this.isFlying) return;
    if (this.currentCount >= this.targetCount) return;

    this.isFlying = true;
    const nextSlotIdx = this.currentCount;
    const slots = document.querySelectorAll("#counterSlotsGrid .counter-slot");
    const targetSlotEl = slots[nextSlotIdx];
    const sourceCardEl = document.getElementById("counterTaskCard");

    Engine.playSubstepSound(nextSlotIdx + 1);

    Engine.animateTokenFlyToSlot(sourceCardEl, targetSlotEl, () => {
      this.currentCount++;
      this.isFlying = false;
      this.render();

      if (this.currentCount >= this.targetCount) {
        Engine.playChime(true);
        Engine.burstConfetti(window.innerWidth * 0.62, window.innerHeight * 0.45, 65);
      }
    });
  },

  completeAndReturnToSchedule() {
    this.close();
    if (this.linkedStepIndex !== null && this.linkedStepIndex === AppState.currentIndex) {
      setTimeout(() => {
        Controllers.handleCardTap(AppState.currentIndex);
      }, 180);
    }
  },

  render() {
    document.getElementById("counterTaskImg").src = this.taskImg;
    document.getElementById("counterTaskLabel").textContent = this.taskLabel;

    const grid = document.getElementById("counterSlotsGrid");
    const isAllDone = this.currentCount >= this.targetCount;
    grid.className = `counter-slots-grid ${isAllDone ? "all-completed" : ""}`;
    grid.innerHTML = "";

    for (let i = 0; i < this.targetCount; i++) {
      const isFilled = i < this.currentCount;
      const slot = document.createElement("div");
      slot.className = `counter-slot ${isFilled ? "is-filled" : ""}`;
      slot.onclick = () => {
        if (!isFilled) this.addOneStep();
      };
      slot.innerHTML = `
        <span class="slot-number">${i + 1}</span>
        <div class="slot-token-stamp">✔</div>
      `;
      grid.appendChild(slot);
    }

    const actionBar = document.getElementById("counterActionBar");
    if (isAllDone) {
      actionBar.innerHTML = `
        <button class="btn btn-primary" onclick="CounterModule.resetCount()">再計一輪 (重設)</button>
        <button class="btn btn-success" onclick="CounterModule.completeAndReturnToSchedule()">完成！返去流程板 ✔</button>
      `;
    } else {
      actionBar.innerHTML = `
        <button class="btn teacher-only" onclick="CounterModule.undoOneStep()">- 退後一格</button>
        <button class="btn teacher-only" onclick="CounterModule.resetCount()">重設 0 次</button>
      `;
    }
  }
};

// 視窗縮放監聽與程式啟動
window.addEventListener("resize", () => Renderer.adjustLayoutToScreen());
AppState.init();
Renderer.renderBoard();
</script>
